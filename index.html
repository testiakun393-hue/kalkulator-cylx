<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="Kalkulator" content="width=device-width, initial-scale=1.0">
    <title>CYLX Kalkulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', monospace;
            overflow: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .calculator {
            position: relative;
            z-index: 1;
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 24px;
            padding: 24px;
            width: 360px;
            box-shadow: 
                0 0 60px rgba(0, 255, 136, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand {
            font-size: 11px;
            color: #00ff88;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            border-color: #00ff88;
            color: #00ff88;
        }

        .mode-btn.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
            color: #00ff88;
        }

        .display-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .history {
            font-size: 13px;
            color: #555;
            text-align: right;
            min-height: 20px;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .display {
            font-size: 42px;
            color: #fff;
            text-align: right;
            font-weight: 300;
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .display.small {
            font-size: 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            height: 64px;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::before {
            width: 200px;
            height: 200px;
        }

        .btn-number {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-number:active {
            transform: translateY(0);
        }

        .btn-operator {
            background: rgba(0, 255, 136, 0.08);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.15);
        }

        .btn-operator:hover {
            background: rgba(0, 255, 136, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.1);
        }

        .btn-operator:active {
            transform: translateY(0);
        }

        .btn-function {
            background: rgba(255, 100, 100, 0.08);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.15);
        }

        .btn-function:hover {
            background: rgba(255, 100, 100, 0.15);
            transform: translateY(-2px);
        }

        .btn-equal {
            background: #00ff88;
            color: #0a0a0a;
            font-weight: 700;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background: #00e67a;
            transform: translateY(-2px);
            box-shadow: 0 4px 25px rgba(0, 255, 136, 0.3);
        }

        .btn-equal:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(0, 255, 136, 0.2);
        }

        .btn-zero {
            grid-column: span 2;
        }

        .scientific {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
            animation: slideDown 0.3s ease;
        }

        .scientific.show {
            display: grid;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-sci {
            background: rgba(100, 150, 255, 0.08);
            color: #6496ff;
            border: 1px solid rgba(100, 150, 255, 0.15);
            height: 50px;
            font-size: 15px;
        }

        .btn-sci:hover {
            background: rgba(100, 150, 255, 0.15);
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Scrollbar custom */
        .display-container::-webkit-scrollbar {
            height: 3px;
        }

        .display-container::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="calculator">
        <div class="header">
            <span class="brand">CYLX</span>
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('basic')" id="btn-basic">STD</button>
                <button class="mode-btn" onclick="setMode('scientific')" id="btn-sci">SCI</button>
            </div>
        </div>

        <div class="scientific" id="scientific-panel">
            <button class="btn btn-sci" onclick="sciFunc('sin')">sin</button>
            <button class="btn btn-sci" onclick="sciFunc('cos')">cos</button>
            <button class="btn btn-sci" onclick="sciFunc('tan')">tan</button>
            <button class="btn btn-sci" onclick="sciFunc('log')">log</button>
            <button class="btn btn-sci" onclick="sciFunc('ln')">ln</button>
            <button class="btn btn-sci" onclick="sciFunc('sqrt')">√</button>
            <button class="btn btn-sci" onclick="sciFunc('pow')">x²</button>
            <button class="btn btn-sci" onclick="sciFunc('pi')">π</button>
            <button class="btn btn-sci" onclick="sciFunc('e')">e</button>
            <button class="btn btn-sci" onclick="sciFunc('fact')">n!</button>
            <button class="btn btn-sci" onclick="sciFunc('inv')">1/x</button>
            <button class="btn btn-sci" onclick="sciFunc('abs')">|x|</button>
        </div>

        <div class="display-container">
            <div class="history" id="history"></div>
            <div class="display" id="display">0</div>
        </div>

        <div class="buttons">
            <button class="btn btn-function" onclick="clearAll()">AC</button>
            <button class="btn btn-function" onclick="deleteLast()">⌫</button>
            <button class="btn btn-function" onclick="appendOperator('%')">%</button>
            <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

            <button class="btn btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

            <button class="btn btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

            <button class="btn btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

            <button class="btn btn-number btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn btn-number" onclick="appendNumber('.')">.</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
        </div>

        <div class="footer">kallkulator dizz // SYSTEM READY</div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;
        let history = '';

        const display = document.getElementById('display');
        const historyEl = document.getElementById('history');

        function updateDisplay() {
            display.textContent = currentInput;
            if (currentInput.length > 12) {
                display.classList.add('small');
            } else {
                display.classList.remove('small');
            }
        }

        function updateHistory() {
            historyEl.textContent = history;
        }

        function appendNumber(num) {
            if (shouldResetScreen) {
                currentInput = num === '.' ? '0.' : num;
                shouldResetScreen = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null) {
                calculate();
            }
            previousInput = currentInput;
            operator = op;
            history = `${previousInput} ${op}`;
            shouldResetScreen = true;
            updateHistory();
        }

        function calculate() {
            if (operator === null || shouldResetScreen) return;
            
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch(operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    if (current === 0) {
                        result = 'Error';
                        break;
                    }
                    result = prev / current; 
                    break;
                case '%': result = prev % current; break;
                default: return;
            }

            history = `${previousInput} ${operator} ${currentInput} =`;
            updateHistory();

            currentInput = result.toString();
            if (currentInput.length > 15) {
                currentInput = parseFloat(currentInput).toExponential(10);
            }
            operator = null;
            shouldResetScreen = true;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            history = '';
            shouldResetScreen = false;
            updateDisplay();
            updateHistory();
        }

        function deleteLast() {
            if (currentInput.length === 1 || (currentInput.length === 2 && currentInput[0] === '-')) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function setMode(mode) {
            const sciPanel = document.getElementById('scientific-panel');
            const btnBasic = document.getElementById('btn-basic');
            const btnSci = document.getElementById('btn-sci');

            if (mode === 'scientific') {
                sciPanel.classList.add('show');
                btnSci.classList.add('active');
                btnBasic.classList.remove('active');
            } else {
                sciPanel.classList.remove('show');
                btnBasic.classList.add('active');
                btnSci.classList.remove('active');
            }
        }

        function sciFunc(func) {
            const val = parseFloat(currentInput);
            let result;

            switch(func) {
                case 'sin': result = Math.sin(val * Math.PI / 180); break;
                case 'cos': result = Math.cos(val * Math.PI / 180); break;
                case 'tan': result = Math.tan(val * Math.PI / 180); break;
                case 'log': result = Math.log10(val); break;
                case 'ln': result = Math.log(val); break;
                case 'sqrt': result = Math.sqrt(val); break;
                case 'pow': result = Math.pow(val, 2); break;
                case 'pi': result = Math.PI; break;
                case 'e': result = Math.E; break;
                case 'fact': result = factorial(val); break;
                case 'inv': result = 1 / val; break;
                case 'abs': result = Math.abs(val); break;
                default: return;
            }

            history = `${func}(${currentInput}) =`;
            updateHistory();
            currentInput = result.toString();
            if (currentInput.length > 15) {
                currentInput = parseFloat(currentInput).toExponential(10);
            }
            shouldResetScreen = true;
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0) return 'Error';
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) result *= i;
            return result;
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') { e.preventDefault(); appendOperator('/'); }
            if (e.key === '%') appendOperator('%');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') deleteLast();
        });

        // Ripple effect on buttons
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body>
</html>
